description: >
  Paramètres de l'obligation d'emploi de travailleurs handicapés en Nouvelle-Calédonie.
  
  Ces paramètres définissent les modalités de l'obligation d'emploi imposée aux entreprises
  de plus de 20 salariés pour recruter des personnes en situation de handicap, ainsi que
  les modes alternatifs de mise en œuvre (contrats de services, mise à disposition, contribution financière).
