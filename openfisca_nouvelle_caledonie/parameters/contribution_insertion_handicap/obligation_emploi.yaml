description: Paramètres de l'obligation d'emploi de travailleurs handicapés
metadata:
  short_label: OETH

seuil_effectif:
  description: Effectif strictement supérieur à ce seuil pour déclencher l'obligation
  values:
    2020-01-01:
      value: 20

taux_beneficiaires:
  description: Taux de bénéficiaires à employer
  values:
    2020-01-01:
      value: 0.025

minimum_fraction:
  description: Minimum appliqué quand le calcul est compris entre 0.5 inclus et 1 exclu
  values:
    2020-01-01:
      value: 0.5

heures_reference:
  description: Nombre d'heures de référence annuel pour le calcul au prorata (choix B)
  values:
    2020-01-01:
      value: 2028

diviseur_unite_contrat:
  description: Diviseur utilisé pour convertir un montant de contrat en unités
  values:
    2020-01-01:
      value: 2000

multiplicateur_contribution:
  description: >
    Barème du multiplicateur appliqué aux bénéficiaires manquants selon l'effectif.
    En-dessous du seuil : multiplicateur_bas ; au seuil et au-dessus : multiplicateur_haut.
  seuil:
    description: Effectif à partir duquel le multiplicateur passe à la valeur haute (borne incluse)
    values:
      2026-01-01:
        value: 100
  bas:
    description: Multiplicateur si effectif strictement inférieur au seuil
    values:
      2026-01-01:
        value: 400
  haut:
    description: Multiplicateur si effectif supérieur ou égal au seuil
    values:
      2026-01-01:
        value: 500

taux_horaire_smg:
  description: Taux horaire du Salaire Minimum Garanti utilisé pour la CIH
  values:
    2026-01-01:
      value: 1000.08    # à ajuster avec la vraie valeur

taux_horaire_smag:
  description: Taux horaire du Salaire Minimum Garanti Agricole utilisé pour la CIH
  values:
    2026-01-01:
      value: 850.07    # à ajuster avec la vraie valeur
